# Régénère chaque nuit data/events.json et data/live/*.json (agenda de l'onglet « Agenda »).
# Gratuit : GitHub Actions est inclus pour les dépôts publics. Aucune clé n'est nécessaire.
name: Mise à jour de l'agenda

on:
  schedule:
    - cron: "17 3 * * *"   # chaque nuit vers 4 h (heure de Paris)
  workflow_dispatch:        # lancement manuel possible depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: agenda
  cancel-in-progress: false

jobs:
  agenda:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/maison-hazparne-app-18k6ej   # branche publiée par GitHub Pages
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Générer l'agenda
        run: node scripts/build-events.mjs
      - name: Enregistrer les changements
        run: |
          if [ -n "$(git status --porcelain data)" ]; then
            git config user.name "agenda-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Agenda : mise à jour automatique"
            git push
          else
            echo "Aucun changement."
          fi
